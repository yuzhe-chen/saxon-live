var P = null, mode = 'daily', round = 0, set = [], scores = [], drawn = [], yMin = 0, yMax = 1, locked = false, revealT = 0, userPts = null;
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function X(i) { return PADL + (W - PADL - PADR) * i / (P.s.pts.length - 1); }
function Y(v) { return PADT + (H - PADT - PADB) * (1 - (v - yMin) / (yMax - yMin)); }
function unY(py) { return yMin + (1 - (py - PADT) / (H - PADT - PADB)) * (yMax - yMin); }
function fmt(v) { var a = Math.abs(v); return a >= 1000 ? Math.round(v).toLocaleString('en-US') : a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(2); }
function lab(d, kind) { if (kind === 'hour') { var h = new Date(d); return h.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + h.toLocaleTimeString('en-US', { hour: 'numeric' }); } var t = new Date(d + 'T12:00:00'); if (kind === 'year') return d.slice(0, 4); if (kind === 'month' || kind === 'week') return t.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }); return t.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + (d.slice(0, 4) !== '2024' ? ', ' + d.slice(0, 4) : ''); }
function render() {
  var pts = P.s.pts, cut = P.cut, line = css('--blue'), faint = css('--text-faint'), dim = css('--text-dim'), grid = css('--line'), green = css('--green'), red = css('--red');
  cx.clearRect(0, 0, W, H); cx.font = '700 14px Nunito, system-ui, sans-serif'; cx.textBaseline = 'middle';
  for (var g = 0; g <= 4; g++) { var gv = yMin + (yMax - yMin) * g / 4, gy = Y(gv); cx.strokeStyle = grid; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(PADL, gy); cx.lineTo(W - PADR, gy); cx.stroke(); cx.fillStyle = faint; cx.textAlign = 'right'; cx.fillText(fmt(gv), PADL - 8, gy); }
  cx.textAlign = 'center'; cx.fillStyle = faint; var kind = P.s.kind; cx.fillText(lab(pts[0][0], kind), PADL + 24, H - 18); cx.fillText(lab(pts[cut - 1][0], kind), X(cut - 1), H - 18); cx.fillText(lab(pts[pts.length - 1][0], kind), W - PADR - 30, H - 18);
  // the unknown part is shaded
  cx.fillStyle = css('--blue-wash'); cx.globalAlpha = .55; cx.fillRect(X(cut - 1), PADT, W - PADR - X(cut - 1), H - PADT - PADB); cx.globalAlpha = 1;
  cx.strokeStyle = faint; cx.setLineDash([5, 5]); cx.beginPath(); cx.moveTo(X(cut - 1), PADT); cx.lineTo(X(cut - 1), H - PADB); cx.stroke(); cx.setLineDash([]);
  cx.lineJoin = 'round'; cx.lineCap = 'round'; cx.lineWidth = 4; cx.strokeStyle = line; cx.beginPath();
  for (var i = 0; i < cut; i++) { if (i === 0) cx.moveTo(X(i), Y(pts[i][1])); else cx.lineTo(X(i), Y(pts[i][1])); } cx.stroke();
  // the player's line
  var up = locked ? userPts : currentUserPts(true);
  if (up) { cx.strokeStyle = locked ? red : css('--gold-dark'); cx.lineWidth = 4; cx.beginPath(); cx.moveTo(X(cut - 1), Y(pts[cut - 1][1]));
    for (var j = 0; j < up.length; j++) cx.lineTo(X(cut + j), Y(up[j])); cx.stroke(); }
  if (locked) { cx.strokeStyle = green; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(X(cut - 1), Y(pts[cut - 1][1]));
    var upto = Math.min(pts.length - cut, Math.floor(revealT * (pts.length - cut)));
    for (var k = 0; k <= upto && cut + k < pts.length; k++) cx.lineTo(X(cut + k), Y(pts[cut + k][1])); cx.stroke(); }
}
// the drawn samples are kept per hidden point; gaps are filled from the nearest drawn neighbors
function currentUserPts(partial) {
  var n = P.s.pts.length - P.cut, have = [], i; for (i = 0; i < n; i++) if (drawn[i] != null) have.push(i);
  if (!have.length) return null; var out = new Array(n), last = P.s.pts[P.cut - 1][1];
  var first = have[0], lastIdx = have[have.length - 1];
  for (i = 0; i < n; i++) {
    if (drawn[i] != null) { out[i] = drawn[i]; continue; }
    if (i < first) { var t0 = (i + 1) / (first + 1); out[i] = last + (drawn[first] - last) * t0; continue; }
    if (i > lastIdx) { out[i] = drawn[lastIdx]; continue; }
    var a = i, b = i; while (drawn[a] == null) a--; while (drawn[b] == null) b++; out[i] = drawn[a] + (drawn[b] - drawn[a]) * (i - a) / (b - a);
  }
  return partial ? out.slice(0, lastIdx + 1) : out;
}
function coverage() { var n = P.s.pts.length - P.cut, c = 0; for (var i = 0; i < n; i++) if (drawn[i] != null) c++; return c / n; }
var down = false, lastI = -1;
function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
function sample(e) {
  var p = pos(e), n = P.s.pts.length, idx = Math.round((p.x - PADL) / (W - PADL - PADR) * (n - 1)) - P.cut;
  idx = Math.max(0, Math.min(n - P.cut - 1, idx)); if (p.x < X(P.cut - 1) - 2 && lastI < 0) return;
  var y = Math.max(yMin, Math.min(yMax, unY(p.y)));
  if (lastI >= 0 && lastI !== idx) { var a = Math.min(lastI, idx), b = Math.max(lastI, idx), ya = drawn[lastI] != null ? drawn[lastI] : y; for (var i = a; i <= b; i++) drawn[i] = ya + (y - ya) * (i - lastI) / (idx - lastI || 1); }
  drawn[idx] = y; lastI = idx;
  $('submit').disabled = coverage() < 0.6; render();
}
cv.addEventListener('pointerdown', function (e) { if (locked) return; down = true; lastI = -1; try { cv.setPointerCapture(e.pointerId); } catch (x) {} sample(e); e.preventDefault(); });
cv.addEventListener('pointermove', function (e) { if (down && !locked) { sample(e); e.preventDefault(); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { cv.addEventListener(t, function () { down = false; lastI = -1; }); });
// ---------- rounds ----------
function show(id) { ['home', 'play', 'end'].forEach(function (x) { $(x).classList.toggle('hide', x !== id); }); window.scrollTo(0, 0); }
function steps() { var h = ''; for (var i = 0; i < set.length; i++) h += '<i class="' + (i < scores.length ? 'done' : i === round ? 'on' : '') + '"></i>'; $('steps').innerHTML = h; $('steps').style.display = mode === 'daily' ? '' : 'none'; }
function startRound() {
  P = mode === 'daily' ? set[round] : (set[0] = practicePuzzle());
  var all = P.s.pts.map(function (p) { return p[1]; }), lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), pad = (hi - lo) * 0.12 || 1;
  yMin = lo - pad; yMax = hi + pad; drawn = []; locked = false; revealT = 0; userPts = null; lastI = -1;
  $('plbl').textContent = mode === 'daily' ? 'Round ' + (round + 1) + ' of ' + set.length : 'Practice'; $('ptitle').textContent = P.s.title; $('punit').textContent = P.s.unit + '. Draw what happens next.';
  $('res').classList.remove('on'); $('submit').disabled = true; $('submit').classList.remove('hide'); $('clear').classList.remove('hide'); steps(); show('play'); render();
}
function score() {
  var n = P.s.pts.length - P.cut, up = currentUserPts(false), e = 0, i, range = Math.max.apply(null, P.s.pts.map(function (p) { return p[1]; })) - Math.min.apply(null, P.s.pts.map(function (p) { return p[1]; }));
  for (i = 0; i < n; i++) e += Math.abs(up[i] - P.s.pts[P.cut + i][1]); e = e / n / (range || 1);
  return { pts: Math.round(100 * Math.max(0, 1 - e / 0.35)), err: e, up: up };
}
$('submit').addEventListener('click', function () {
  if (locked || coverage() < 0.6) return; var r = score(); locked = true; userPts = r.up; $('submit').classList.add('hide'); $('clear').classList.add('hide');
  var el = $('pts'); el.textContent = r.pts; el.className = 'big' + (r.pts < 35 ? ' bad' : r.pts < 65 ? ' low' : '');
  $('why').textContent = r.pts >= 90 ? 'Remarkably close.' : r.pts >= 65 ? 'A good read of the trend. Off by ' + (r.err * 100).toFixed(1) + '% of the range.' : r.pts >= 35 ? 'The shape was partly right. Off by ' + (r.err * 100).toFixed(1) + '% of the range.' : 'The data went another way. Off by ' + (r.err * 100).toFixed(1) + '% of the range.';
  $('srcl').textContent = 'Source: ' + P.s.src + '. ' + lab(P.s.pts[0][0], P.s.kind) + ' to ' + lab(P.s.pts[P.s.pts.length - 1][0], P.s.kind) + '.';
  $('next').textContent = mode === 'daily' && round === set.length - 1 ? 'Results' : 'Next'; $('res').classList.add('on'); scores.push(r.pts); steps();
  var t0 = performance.now(); (function step(t) { revealT = Math.min(1, (t - t0) / 1200); render(); if (revealT < 1) requestAnimationFrame(step); })(t0);
  D.plays++; persist();
});
$('clear').addEventListener('click', function () { if (locked) return; drawn = []; lastI = -1; $('submit').disabled = true; render(); });
$('next').addEventListener('click', function () {
  if (mode === 'daily') { round++; if (round >= set.length) { finish(); return; } startRound(); } else startRound();
});
function finish() {
  var tot = scores.reduce(function (a, b) { return a + b; }, 0); D.daily = { date: today(), scores: scores.slice() }; D.best = Math.max(D.best, tot); persist(); updateBest();
  $('emode').textContent = 'Daily'; $('etot').textContent = tot; $('eof').textContent = 'out of ' + scores.length * 100;
  $('erows').innerHTML = set.map(function (p, i) { return '<div class="row"><span class="n">' + (i + 1) + '</span><span class="t">' + p.s.title + '</span><b>' + scores[i] + '</b></div>'; }).join(''); show('end');
}
function updateBest() { $('best').textContent = 'Best ' + D.best; }
function begin(m) { mode = m; round = 0; scores = []; if (m === 'daily') { set = dailySet(); } else set = [null]; startRound(); }
$('mDaily').addEventListener('click', function () {
  if (D.daily && D.daily.date === today() && D.daily.scores.length === 5) { set = dailySet(); scores = D.daily.scores.slice(); mode = 'daily'; $('emode').textContent = 'Daily'; finishView(); return; }
  begin('daily');
});
function finishView() { var tot = scores.reduce(function (a, b) { return a + b; }, 0); $('etot').textContent = tot; $('eof').textContent = 'out of ' + scores.length * 100 + '. Come back tomorrow for five new ones.';
  $('erows').innerHTML = set.map(function (p, i) { return '<div class="row"><span class="n">' + (i + 1) + '</span><span class="t">' + p.s.title + '</span><b>' + scores[i] + '</b></div>'; }).join(''); show('end'); }
$('mPractice').addEventListener('click', function () { begin('practice'); });
$('again').addEventListener('click', function () { begin('practice'); });
$('toMenu').addEventListener('click', function () { show('home'); refreshHome(); });
$('brand').addEventListener('click', function () { try { parent.postMessage({ type: 'games-menu' }, '*'); } catch (e) {} });
function refreshHome() { var done = D.daily && D.daily.date === today() && D.daily.scores.length === 5; $('dSub').textContent = done ? 'Done for today: ' + D.daily.scores.reduce(function (a, b) { return a + b; }, 0) + ' of 500. See your results.' : 'Five real data sets, the same for everyone today'; }
window.addEventListener('resize', function () { if (P) render(); });
new MutationObserver(function () { if (P) render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
var local = readLocal(); if (local) D = local; updateBest(); refreshHome();
loadRemote(function (rem) { if (rem && (!local || rem.ts >= D.ts)) { D = rem; } else if (rem) { D.best = Math.max(D.best, rem.best); } updateBest(); refreshHome(); });
</script>
