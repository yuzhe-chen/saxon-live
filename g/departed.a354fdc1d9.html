<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Departed</title>
<style>
html,body{margin:0;height:100%;background:#16202E;overflow:hidden;overscroll-behavior:none}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#err{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#EFE8DA;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:20px}
#err a{color:#EFE8DA;background:#8E2A33;padding:11px 20px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
</style></head><body>
<!-- Departed (the owner's daily murder mystery on a train through time) runs on its own site; the planner shows it full size in this frame -->
<iframe id="g" allow="fullscreen; autoplay; clipboard-write" title="Departed"></iframe>
<div id="err"><div>Departed didn't load.</div><a id="open" target="_blank" rel="noopener">Open Departed in a new tab</a></div>
<script>
(function(){
  var URL_='https:'+'/'+'/departed.web.app/',g=document.getElementById('g'),err=document.getElementById('err'),ok=false;
  document.getElementById('open').href=URL_;
  g.addEventListener('load',function(){ok=true;err.style.display='none';try{g.focus();}catch(e){}});
  setTimeout(function(){if(!ok)err.style.display='flex';},20000);
  g.src=URL_;
  window.addEventListener('focus',function(){try{g.focus();}catch(e){}});
})();
</script></body></html>
