<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scrapyard Trading</title><base href="https://cdn.jsdelivr.net/gh/yuzhe-chen/saxon-arcade@0860542ff681ba536a86f717470214eae85c048f/cards/"><style>/* Scrapyard design tokens. The only place colour, type, radius and spacing are defined. See design/v3/2d/DESIGN.md */
@font-face{font-family:"Big Shoulders Display";src:url(assets/fonts/BigShouldersDisplay.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(assets/fonts/InstrumentSans.woff2) format("woff2");font-weight:400 700;font-stretch:75% 100%;font-display:swap}
:root{
  /* ground: late-afternoon shadow, a warm violet-brown that sits under the yard's amber light */
  --ground:#150F18; --ground-2:#1E1624; --raised:#2A1F31; --raised-2:#3A2C42; --line:#4A3A54;
  /* text: white at high contrast, soft tints for secondary */
  --text:#F5F0F6; --text-soft:#BCAEC4; --text-dim:#85768E;
  /* accent: low sun (coral-orange) for every primary action; --hl is the selection ring (coral); teal answers for good news */
  --accent:#FF7A3D; --accent-hi:#FF9158; --accent-lo:#E2601F; --on-accent:#2A0F02;
  --teal:#2FC4AE; --hl:#FF7A3D; --hl-dim:#C13E1F; --sky:#4C9BF5; --violet:#9B6BFF; --rose:#F0629B;
  /* card frame per tier: colour carries tier, foil carries the rest */
  --t0:#59606B; --t1:#2E9C72; --t2:#3A78DA; --t3:#7C4FDC; --t4:#E8742C;
  --ok:#2FC4AE; --bad:#F0629B;
  --scrim:rgba(14,8,18,.66);
  --wash:#3A2644; --wash-2:rgba(155,107,255,.14); --face:#140E18; --scrim2:rgba(14,8,18,.78); --scrim3:rgba(18,10,22,.99); --pill-dark:rgba(21,15,24,.55); --pill-bg:rgba(21,15,24,.78); --done:#5a3322; --plate:#241a2c; --plate:#16282b;
  --cap-nudge:0em; /* uppercase condensed caps sit high in their line box; pills nudge the text down by this much */
  --f-display:"Big Shoulders Display","Arial Narrow",sans-serif; --f-text:"Instrument Sans",system-ui,sans-serif;
  /* type scale (px) */
  --s-1:11px; --s0:13px; --s1:15px; --s2:18px; --s3:24px; --s4:32px; --s5:48px; --s6:72px;
  /* space 4 base */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px; --sp7:48px;
  --r-card:5%/3.6%; --r-sm:8px; --r-md:14px; --r-pill:999px;
  --ease:cubic-bezier(.2,.7,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --shadow-soft:0 10px 24px -10px rgba(0,0,0,.65);
  --holo:linear-gradient(115deg,#6fe3ff 0%,#8d7bff 22%,#ff7bd0 42%,#ff9a6b 58%,#5fe3c4 78%,#6fe3ff 100%);
  --shine:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 55%);
}

/* theme B: graphite and dark teal ground, safety orange accent (picks up the yard's earth tones and rim light) */
/* final palette (owner's choice after trying graphite/dark teal): warm violet ground, coral actions. */

/* The card. 1em = width/25.2, so every measure scales. Print-like layers: frame, foil ring, face, window, cut-out, text, sweep. */
.card{--w:176px;--rx:0deg;--ry:0deg;--sx:160%;--hx:0%;font-size:calc(var(--w) / 25.2);width:var(--w);aspect-ratio:5/7;position:relative;perspective:90em;flex:none;font-family:var(--f-text);user-select:none;-webkit-user-select:none}
.card.tappable{cursor:pointer}
.c-flip{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s var(--ease-out)}
.card.lit .c-flip{transition:transform .08s linear}
.card.turned .c-flip{transform:rotateX(var(--rx)) rotateY(calc(180deg + var(--ry)))}
.card.down .c-flip{transform:rotateY(180deg)}
.c-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.3em/1.1em;color:var(--text)}
.c-back,.c-reverse{transform:rotateY(180deg)}
.c-frame{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,color-mix(in srgb,var(--fr) 82%,#fff),var(--fr) 40%,color-mix(in srgb,var(--fr) 70%,#000));box-shadow:inset 0 .1em 0 rgba(255,255,255,.22),inset 0 -.1em 0 rgba(0,0,0,.45),inset 0 0 0 .08em rgba(0,0,0,.35),0 .9em 1.6em -.6em rgba(0,0,0,.7)}
.t0{--fr:var(--t0)} .t1{--fr:var(--t1)} .t2{--fr:var(--t2)} .t3{--fr:var(--t3)} .t4{--fr:var(--t4)}
.c-face{position:absolute;inset:.85em;border-radius:.8em/.7em;background:var(--face);box-shadow:inset 0 .12em .3em rgba(0,0,0,.6),0 .08em 0 rgba(255,255,255,.12);overflow:visible}
.c-head{position:absolute;left:1.1em;right:1.1em;top:.7em;height:2.6em;display:flex;align-items:center;justify-content:space-between;gap:.6em}
.c-name{font:700 2.1em/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);text-shadow:0 .06em .1em rgba(0,0,0,.6)}
.c-pips{display:flex;gap:.3em;flex:none}
.c-pips i{width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.14)}
.c-pips i.on{background:#fff;box-shadow:0 0 .5em color-mix(in srgb,var(--fr) 80%,#fff)}
/* art window: a Poly Haven scan, tinted, with a soft light behind the object */
.c-window{position:absolute;left:.9em;right:.9em;top:3.5em;height:16em;border-radius:.5em;overflow:hidden;box-shadow:inset 0 .12em .35em rgba(0,0,0,.7),0 .08em 0 rgba(255,255,255,.1)}
.c-bg{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 62%,rgba(255,255,255,.2),transparent 70%),linear-gradient(rgba(20,10,28,.18),rgba(20,10,28,.62)),var(--tex,none) center/cover;background-color:color-mix(in srgb,var(--fr) 35%,#1b1220)}
.c-foilart{position:absolute;inset:0;opacity:0;mix-blend-mode:color-dodge;background:var(--holo);background-size:300% 100%;background-position:var(--hx) 0;pointer-events:none}
/* cut-out breaks out of the window: bottom edge overlaps the text zone, wide parts overhang the sides */
.c-art{position:absolute;inset:0;pointer-events:none;transform:translateZ(1.2em)}
.c-art img,.c-art canvas{position:absolute;max-width:none;max-height:none;filter:drop-shadow(0 .45em .4em rgba(0,0,0,.55))}
.c-body{position:absolute;left:1.1em;right:1.1em;top:22.2em;bottom:2.8em}
.c-ab{display:flex;justify-content:space-between;align-items:baseline;gap:.5em;margin-bottom:.25em}
.c-ab b{font:700 1.75em/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.c-fx{font:700 1.15em/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:var(--raised-2);padding:.3em .7em;border-radius:99em;white-space:nowrap}
.c-body p{font-size:1.2em;line-height:1.3;color:var(--text-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-foot{position:absolute;left:1.1em;right:1.1em;bottom:.7em;display:flex;justify-content:space-between;gap:.6em;font:600 1em/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);font-variant-numeric:tabular-nums}
.c-who{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.06em}
/* foil: holographic band on the frame ring (rare), plus art window (epic), plus whole face (legendary) */
.c-holo{position:absolute;inset:0;border-radius:inherit;padding:.85em;background:var(--holo);background-size:300% 100%;background-position:var(--hx) 0;opacity:0;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mix-blend-mode:overlay}
.t1 .c-frame{box-shadow:inset 0 .1em 0 rgba(255,255,255,.3),inset 0 -.1em 0 rgba(0,0,0,.45),inset 0 0 0 .1em #9DB2BA55,0 .9em 1.6em -.6em rgba(0,0,0,.7)}
.t2 .c-holo{mix-blend-mode:hard-light;opacity:.55}
.t3 .c-holo{opacity:.8;mix-blend-mode:hard-light} .t3 .c-foilart{opacity:.2;mix-blend-mode:overlay}
.t4 .c-holo{opacity:.85;mix-blend-mode:hard-light} .t4 .c-foilart{opacity:.32;mix-blend-mode:overlay}
.t4 .c-face{background:var(--face) linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%)}
.t4 .c-face::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--holo),url(assets/tex/plate.webp) center/60%;background-size:300% 100%,60%;background-position:var(--hx) 0,0 0;background-blend-mode:multiply;mix-blend-mode:color-dodge;opacity:.13;pointer-events:none}
/* light sweep: one diagonal band that follows the pointer or plays once on reveal */
.c-sweep{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.34) 50%,transparent 62%);background-size:260% 100%;background-position:var(--sx) 0;opacity:0;mix-blend-mode:soft-light}
.t1 .c-sweep{opacity:.55}.t2 .c-sweep{opacity:.8}.t3 .c-sweep,.t4 .c-sweep{opacity:1}
/* back */
.c-bk{position:absolute;left:1.1em;right:1.1em;top:3.8em;bottom:1em;display:flex;flex-direction:column;gap:.7em}
.c-bk .c-ab.big b{font-size:2.3em;letter-spacing:.04em}
.c-bk-text{font-size:1.4em;line-height:1.35;color:var(--text)}
.c-pitch{font-size:1.2em;line-height:1.35;color:var(--text-soft);border-left:.15em solid var(--line);padding-left:.8em;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.c-rows{display:grid;grid-template-columns:auto 1fr;gap:.45em 1.2em;margin-top:auto;font-size:1.2em}
.c-rows dt{font:600 .85em/1.6 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)} .c-rows dd{text-align:right;font-variant-numeric:tabular-nums}
.c-credit{font-size:.95em;color:var(--text-dim);line-height:1.3}
/* reverse */
.c-reverse .c-face{display:grid;place-items:center;background:var(--face) url(assets/tex/plate.webp) center/50%;background-blend-mode:soft-light}
.c-mark{display:flex;flex-direction:column;align-items:center;gap:.4em;font-family:var(--f-display);text-transform:uppercase}
.c-mark b{font-size:3.4em;font-weight:800;letter-spacing:.14em;line-height:1;color:var(--text)} .c-mark span{font-size:1.2em;letter-spacing:.5em;color:var(--text-soft)}
.c-count{position:absolute;right:-.4em;top:-.4em;z-index:2;font:700 1.3em/1 var(--f-display);letter-spacing:.06em;background:var(--accent);color:var(--on-accent);padding:.35em .7em;border-radius:99em}
/* album ghost: unowned silhouette */
.card.ghost .c-frame{background:var(--raised);box-shadow:inset 0 0 0 .1em var(--line);}
.card.ghost .c-face{background:var(--ground-2);box-shadow:none}
.card.ghost .c-window{top:1.2em;height:19em;box-shadow:none;background:none}
.card.ghost .c-bg{background:none}
.card.ghost .c-art img{filter:brightness(0) opacity(.38);}
.card.ghost .c-foot{justify-content:center}
.card.ghost.tappable:hover .c-art img{filter:brightness(0) opacity(.55)}
.card.small .c-body p{display:none}

.c-meta{position:absolute;left:1.1em;right:1.1em;bottom:2.2em;display:flex;justify-content:space-between;padding-top:.5em;border-top:.08em solid rgba(255,255,255,.1);font:600 1em/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--text-soft)}
.c-body p{font-size:1.28em}

.card.lift .c-flip,.card.shake .c-flip{will-change:transform}

/* card halo for the foil tiers: one non-clipped layer behind the card, a smooth falloff to zero alpha (closest-side), stronger while lit */
.t1{--tg:46 156 114}.t2{--tg:58 120 218}.t3{--tg:124 79 220}.t4{--tg:232 116 44}
.card.t1::before,.card.t2::before,.card.t3::before,.card.t4::before{content:"";position:absolute;inset:-16%;z-index:-1;pointer-events:none;border-radius:50%;opacity:.45;transition:opacity .3s;background:radial-gradient(closest-side,rgb(var(--tg)/.34) 0%,rgb(var(--tg)/.2) 38%,rgb(var(--tg)/.09) 62%,rgb(var(--tg)/.03) 82%,rgb(var(--tg)/0) 100%)}
.card.t1::before{opacity:.2}.card.t3::before{opacity:.6}.card.t4::before{opacity:.75}
.card.lit::before,.card.tappable:hover::before{opacity:1}
.card.small::before,.card.ghost::before,.c-side::before{display:none}

:root{--d-bg:#131f24;--d-card:#202f36;--d-line:#37464f;--d-text:#f1f7fb;--d-soft:#8799a3;--d-green:#58cc02;--d-green-d:#58a700;--d-blue:#1cb0f6;--d-blue-d:#1899d6;--d-red:#ff4b4b;--d-gold:#ffc800;--fz:'Nunito',ui-rounded,system-ui,sans-serif;--fd:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--d-bg);color:var(--d-text);font-family:var(--fz);overscroll-behavior:none;overflow:hidden}
*{overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--d-line)}
#back{width:40px;height:40px;border:2px solid var(--d-line);border-bottom-width:4px;border-radius:14px;background:var(--d-card);color:var(--d-text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#back:active{transform:translateY(2px);border-bottom-width:2px}
#back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;flex-direction:column;min-width:0}
.hd b{font:600 22px/1.1 var(--fd)}
.hd span{font:700 12px/1.3 var(--fz);color:var(--d-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{flex:none;display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.tabs button,.seg button,.chips button{font:800 13px/1 var(--fz);letter-spacing:.8px;text-transform:uppercase;color:var(--d-soft);background:var(--d-card);border:2px solid var(--d-line);border-bottom-width:4px;border-radius:14px;padding:11px 16px;cursor:pointer;white-space:nowrap}
.tabs button.on,.seg button.on,.chips button.on{color:var(--d-blue);border-color:var(--d-blue);background:#1b3140}
.tabs button:active,.seg button:active,.chips button:active{transform:translateY(2px);border-bottom-width:2px}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:clip;padding:8px 16px 40px}
.btn{font:800 15px/1 var(--fz);letter-spacing:.8px;text-transform:uppercase;border:0;border-radius:16px;padding:14px 22px;cursor:pointer;color:#fff;background:var(--d-green);box-shadow:0 4px 0 var(--d-green-d)}
.btn.blue{background:var(--d-blue);box-shadow:0 4px 0 var(--d-blue-d)}
.btn.ghost{background:var(--d-card);color:var(--d-text);box-shadow:0 4px 0 var(--d-line)}
.btn.big{font-size:17px;padding:16px 36px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.btn:disabled{background:var(--d-line);color:var(--d-soft);box-shadow:0 4px 0 #2b3840;cursor:default}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:16px}
.err{color:var(--d-red);font:800 14px/1.3 var(--fz);text-align:center;margin-top:12px}
.sub{color:var(--d-soft);font:700 14px/1.3 var(--fz);text-align:center}
.pad{padding:40px 0}
.empty{color:var(--d-soft);font:700 14px/1.3 var(--fz);text-align:center;padding:24px 0}
.empty.sm{padding:10px 0}
.packs{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 0}
.stack{position:relative;width:260px;height:240px}
.stack .st{position:absolute;left:55px;top:10px;transform:rotate(var(--r))}
.big-n{font:600 32px/1 var(--fd)}
.deal{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:16px 0}
.opening{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.dl{cursor:pointer;animation:dl .4s var(--ease) backwards}
@keyframes dl{from{opacity:0;transform:translateY(40px) scale(.8)}}
.card.shown{cursor:default}
.card.glow2{filter:drop-shadow(0 0 18px rgba(58,120,218,.8))}.card.glow3{filter:drop-shadow(0 0 22px rgba(124,79,220,.9))}.card.glow4{filter:drop-shadow(0 0 28px rgba(232,116,44,.95))}
.new{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);z-index:3;background:var(--d-green);color:#fff;font:800 11px/1 var(--fz);letter-spacing:.8px;text-transform:uppercase;border-radius:10px;padding:5px 9px;box-shadow:0 2px 0 var(--d-green-d)}
.bonus{width:100%;text-align:center;color:var(--d-gold);font:800 15px/1.3 var(--fz)}
.log{margin-top:16px;display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.lg{background:var(--d-card);border:2px solid var(--d-line);border-radius:12px;padding:9px 12px;font:700 13px/1.3 var(--fz);color:var(--d-soft)}
.album{max-width:980px;margin:0 auto}

.set{margin-top:22px}

.pc{font:800 13px/1 var(--fz);color:var(--d-soft)}.pc.full{color:var(--d-gold)}
.bar{height:10px;border-radius:6px;background:var(--d-line);overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--d-green);border-radius:6px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.grid.pick{justify-content:center;margin-top:8px}
.card.dim{opacity:.4}
.fuse{max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.fz-row{display:flex;align-items:center;gap:14px}
.slot{width:112px;height:150px;border:3px dashed var(--d-line);border-radius:18px;background:var(--d-card);color:var(--d-soft);font:800 14px/1 var(--fz);text-transform:uppercase;letter-spacing:.8px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.slot.on{border-style:solid;border-color:var(--d-blue)}
.plus{font:600 34px/1 var(--fd);color:var(--d-soft)}
.seg,.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pick-h{font:600 18px/1.2 var(--fd);margin-top:10px;text-align:center}
.fz-prev{display:flex;justify-content:center}
.trade{max-width:760px;margin:0 auto;padding-top:12px;display:flex;flex-direction:column;gap:14px;align-items:stretch}

.offers{display:flex;flex-direction:column;gap:12px}

.tag{font:800 11px/1 var(--fz);letter-spacing:.8px;text-transform:uppercase;color:var(--d-blue);border:2px solid var(--d-blue);border-radius:8px;padding:3px 7px}
.oc{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.its{display:flex;gap:10px;flex-wrap:wrap}
.swap{font:800 13px/1 var(--fz);letter-spacing:.8px;text-transform:uppercase;color:var(--d-soft)}
.offer .btn{align-self:flex-end;padding:11px 18px;font-size:13px}
.newo{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.box{background:var(--d-card);border:2px solid var(--d-line);border-radius:16px;padding:10px 12px;min-height:60px}
.inp{font:700 15px/1 var(--fz);color:var(--d-text);background:var(--d-card);border:2px solid var(--d-line);border-radius:14px;padding:13px 14px;outline:0;width:100%}
.inp:focus{border-color:var(--d-blue)}
.newo .btn{align-self:center}
.ov{position:fixed;inset:0;z-index:20;background:rgba(19,31,36,.92);display:flex;align-items:center;justify-content:center;overflow:auto}
.ov-in{display:flex;flex-direction:column;align-items:center;padding:20px;position:relative}
.rv-glow{position:absolute;width:420px;height:420px;border-radius:50%;opacity:0;pointer-events:none;z-index:-1}
.rv-glow.b0,.rv-glow.b1,.rv-glow.b2,.rv-glow.b3,.rv-glow.b4,.rv-glow.p2,.rv-glow.p3,.rv-glow.p4{opacity:.6;background:radial-gradient(closest-side,var(--gc,#3a78da),transparent)}
.rv-glow.b2,.rv-glow.p2{--gc:#3a78da}.rv-glow.b3,.rv-glow.p3{--gc:#7c4fdc}.rv-glow.b4,.rv-glow.p4{--gc:#e8742c}.rv-glow.b1{--gc:#2e9c72}.rv-glow.b0{--gc:#59606b}

.btn.blue{background:var(--shine),var(--accent);box-shadow:none}
.btn.ghost{background:var(--raised);color:var(--text);box-shadow:none}.btn.ghost:hover:not(:disabled){background:var(--raised-2)}

.pc.full{color:var(--teal)}
.bonus{color:var(--accent-hi)}

.offer{padding:14px}

.ov{background:var(--scrim3)}
