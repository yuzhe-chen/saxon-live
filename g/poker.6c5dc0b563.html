<script id="engine">
// ---------- rules engine (pure, no DOM). Chips are integers. ----------
var PE = (function () {
  'use strict';
  var STREETS = ['Preflop', 'Flop', 'Turn', 'River', 'Showdown'];
  function newGame(o) {
    var g = { players: [], sb: o.sb, bb: o.bb, ante: o.ante || 0, every: o.every || 0, level: 1, handNo: 0, buttonId: null, nextId: 1, hand: null, history: [] };
    (o.names || []).forEach(function (n) { addPlayer(g, n, o.stack); });
    return g;
  }
  function addPlayer(g, name, stack) {
    var p = { id: g.nextId++, name: name, stack: stack, buyin: stack, out: false, gone: false };
    g.players.push(p); return p;
  }
  function P(g, id) { for (var i = 0; i < g.players.length; i++) if (g.players[i].id === id) return g.players[i]; return null; }
  function canDeal(g) { return g.players.filter(function (p) { return !p.gone && !p.out && p.stack > 0; }).length >= 2; }
  function put(g, h, id, amt) {
    var p = P(g, id); amt = Math.min(amt, p.stack);
    p.stack -= amt; h.bet[id] = (h.bet[id] || 0) + amt; h.contrib[id] = (h.contrib[id] || 0) + amt;
    if (p.stack === 0) h.allin[id] = true;
    return amt;
  }
  function startHand(g) {
    if (g.hand && !g.hand.done) throw new Error('hand in progress');
    var seated = g.players.filter(function (p) { return !p.gone; });
    var elig = seated.filter(function (p) { return !p.out && p.stack > 0; });
    if (elig.length < 2) return false;
    g.handNo++;
    if (g.every > 0 && g.handNo > 1 && (g.handNo - 1) % g.every === 0) { g.sb *= 2; g.bb *= 2; g.ante *= 2; g.level++; }
    // button moves to the next eligible player after the old button (table order = players array order)
    var order = g.players.map(function (p) { return p.id; });
    var ok = function (id) { return elig.some(function (p) { return p.id === id; }); };
    var start = g.buttonId == null ? -1 : order.indexOf(g.buttonId);
    if (start < 0 && g.buttonId != null) start = -1;
    var btn = null;
    for (var k = 1; k <= order.length; k++) { var id = order[(start + k + order.length) % order.length]; if (ok(id)) { btn = id; break; } }
    g.buttonId = btn;
    var bi = order.indexOf(btn), seats = [];
    for (k = 1; k <= order.length; k++) { id = order[(bi + k) % order.length]; if (ok(id)) seats.push(id); }
    // seats: left of button first, button last
    var h = { no: g.handNo, seats: seats, street: 0, bet: {}, contrib: {}, folded: {}, allin: {}, acted: {}, actedAt: {}, cur: 0, minRaise: g.bb,
      toAct: null, done: false, pots: null, log: [], buttonId: btn, sbId: null, bbId: null, blinds: [g.sb, g.bb, g.ante], result: null };
    g.hand = h;
    if (g.ante > 0) seats.forEach(function (id) { var a = put(g, h, id, g.ante); h.bet[id] -= a; });
    var sbId, bbId;
    if (seats.length === 2) { sbId = btn; bbId = seats[0]; } else { sbId = seats[0]; bbId = seats[1]; }
    h.sbId = sbId; h.bbId = bbId;
    var a1 = put(g, h, sbId, g.sb), a2 = put(g, h, bbId, g.bb);
    if (g.ante > 0) h.log.push('Antes ' + g.ante);
    h.log.push(P(g, sbId).name + ' posts SB ' + a1);
    h.log.push(P(g, bbId).name + ' posts BB ' + a2);
    h.cur = g.bb; h.minRaise = g.bb;
    var first = seats.length === 2 ? sbId : seats[2 % seats.length];
    h.toAct = nextActor(g, h, seats.indexOf(first), true);
    settle(g);
    return true;
  }
