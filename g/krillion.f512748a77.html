(function(){var B='https:'+'/'+'/cdn.jsdelivr.net/gh/yuzhe-chen/saxon-live@e3a6d9eb9897d2538ea72c65fb3b6d1093cca20a/krillion/game.part',

function get(b,i,n){return fetch(b+i).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).catch(function(e){if(n>0)return new Promise(function(ok){setTimeout(ok,800);}).then(function(){return get(b,i,n-1);});throw e;});}

.catch(function(){document.getElementById('kl').textContent='Could not load krillion. Try again.';
