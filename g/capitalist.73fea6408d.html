<style>
  :root {
    --green: #58cc02; --green-dark: #58a700; --green-hi: #61e002; --green-wash: #d7ffb8;
    --blue: #4b9af3; --blue-dark: #3c81db; --blue-hi: #63a8f6; --blue-wash: #e6f1ff; --blue-line: #a4ceff;
    --red: #ff4b4b; --red-dark: #ea2b2b;
    --gold: #ffc800; --gold-dark: #e5a400; --gold-hi: #ffd43a; --gold-ink: #cd7900;
    --purple: #ce82ff; --purple-dark: #a568cc;
    --bg: #fff; --panel: #fff; --panel-soft: #f7f7f7; --line: #e5e5e5; --line-hi: #d0d0d0;
    --text: #4b4b4b; --text-dim: #777; --text-faint: #afafaf; --money: #58a700;

  }
  :root[data-theme="dark"] {
    --bg: #131f24; --panel: #131f24; --panel-soft: #202f36; --line: #37464f; --line-hi: #52656d;
    --text: #f1f7fb; --text-dim: #8799a3; --text-faint: #6f8691; --money: #79d634;
    --blue-wash: #1c3150; --blue-line: #3c81db; --green-wash: #1c3a12; --gold-ink: #ffc800;
    --scrim: rgba(19, 31, 36, .9);
    color-scheme: dark;
  }
  * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
  *:focus, *:focus-visible { outline: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 700;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; color: inherit; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; display: block; }

  /* shared button skins: blue = can buy, grey = can't yet */

  .bg { border-color: var(--line-hi); background: var(--line); color: var(--text-dim); }

  .bo:not(.bg):active { transform: translateY(2px); border-bottom-width: 2px; }

  /* ---------- stage: 1280x720 ---------- */
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: var(--bg); }
  #side { position: absolute; left: 0; top: 0; width: 240px; height: 720px; border-right: 2px solid var(--line); }
  #cap { position: absolute; left: 16px; top: 18px; width: 206px; height: 196px; cursor: pointer; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px;
    background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #cap svg { width: 104px; height: 104px; }
  #cap span { font: 700 22px/1 var(--display); letter-spacing: -0.02em; color: var(--text); }
  @media (hover: hover) { #cap:hover { background: var(--panel-soft); } }
  #cap:active { transform: translateY(2px); border-bottom-width: 2px; }
  #side .rail { display: none; }
  .nav { position: absolute; left: 16px; width: 206px; height: 56px; }
  .nav[data-p="unlocks"] { top: 238px; }
  .nav[data-p="upgrades"] { top: 304px; }
  .nav[data-p="managers"] { top: 370px; }
  .nav[data-p="investors"] { top: 436px; }
  .nav .pp { position: absolute; inset: 0; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--bg); }
  .nav .kn { display: none; position: absolute; right: 14px; top: 50%; width: 12px; height: 12px; margin-top: -8px; border-radius: 50%; background: var(--red); z-index: 1; }
  .nav.new .kn { display: block; }
  .nav .lbl { position: absolute; inset: 0 0 4px; display: flex; align-items: center; justify-content: center;
    font: 800 15px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
  .nav.on .pp { border-color: var(--blue-line); background: var(--blue-wash); }
  .nav.on .lbl { color: var(--blue); }
  .nav:active .pp { top: 2px; border-bottom-width: 2px; }
  .nav:active .lbl, .nav:active .kn { transform: translateY(2px); }
  @media (hover: hover) { .nav:not(.on):hover .pp { background: var(--panel-soft); } }
  .shop { position: absolute; left: 16px; top: 638px; width: 206px; height: 60px; border-radius: 12px; border: 2px solid var(--gold-dark); border-bottom-width: 4px; background: var(--gold);
    display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; }
  .shop svg { width: 40px; height: 40px; flex: none; }
  .shop i { font: 800 16px/1 var(--sans); font-style: normal; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
  @media (hover: hover) { .shop:hover { background: var(--gold-hi); } }

  /* ---------- top ---------- */

    background: var(--red); pointer-events: none; }

    display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; }

  .tag:active { transform: translateY(2px); border-bottom-width: 2px; }

  .best .lb { position: absolute; left: 10px; top: 0; bottom: 0; width: auto; height: auto; display: flex; align-items: center; border: 0; border-radius: 0; background: none;
    font: 800 13px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--blue-dark); }
  .best .bc { position: absolute; left: 50px; right: 6px; top: 4px; height: 46px; }
  .best .bi { position: absolute; left: 0; top: 3px; width: 40px; height: 40px; border-radius: 10px; background-color: var(--panel-soft); background-size: 34px 34px; background-position: center; background-repeat: no-repeat; }
  .best .bp { display: none; }
  .best b { position: absolute; left: 44px; right: 0; top: 0; text-align: center; font: 800 18px/46px var(--sans); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (hover: hover) { .best:not(.no):hover { background: var(--panel-soft); } }
  .best:not(.no):active { transform: translateY(2px); border-bottom-width: 2px; }

  /* ---------- businesses ---------- */
  #grid { position: absolute; left: 0; top: 0; }

  @keyframes flash { 0% { background: var(--gold); } 100% { background: var(--blue); } }
  .ic { position: absolute; left: 0; top: 0; width: 100px; height: 106px; cursor: pointer; touch-action: manipulation; }
  .ic .ring { position: absolute; left: 4px; top: 0; width: 92px; height: 92px; border-radius: 20px; overflow: hidden; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--panel-soft); }
  .ic .bd { position: absolute; left: 9px; top: 8px; width: 70px; height: 70px; background-size: 100% 100%; }
  .ic .cn { position: absolute; left: 22px; top: 76px; width: 56px; height: 30px; border-radius: 15px; text-align: center; background: var(--blue); border-bottom: 3px solid var(--blue-dark);

  @keyframes pop { 0% { transform: scale(.9); } 100% { transform: scale(1); } }
  .hit { position: absolute; left: 108px; top: 0; width: 286px; height: 48px; cursor: pointer; touch-action: manipulation; border-radius: 14px; overflow: hidden;
    background: var(--panel-soft); border: 2px solid var(--line); border-bottom-width: 4px; }
  .hit .gf { position: absolute; inset: 0; background: var(--blue); clip-path: inset(0 100% 0 0); }

  .hit .tx .a { font: 700 26px/1 var(--display); letter-spacing: -0.02em; }
  .hit .tx .b { font: 800 13px/1 var(--sans); text-transform: uppercase; letter-spacing: .04em; }
  .hit .tx .a { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .hit.ps .tx { padding-top: 0; align-items: center; }
  .hit.ps .tx .b { display: none; }
  .buy { position: absolute; left: 108px; top: 54px; width: 184px; height: 52px; }
  .buy.no { cursor: default; }
  .buy .lb { position: absolute; left: 12px; top: 6px; font: 800 13px/16px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  .buy .qt { position: absolute; left: 12px; top: 23px; font: 700 17px/18px var(--display); white-space: nowrap; }
  .buy .c { position: absolute; right: 12px; top: 5px; text-align: right; white-space: nowrap; }
  .buy .c .a { display: block; font: 700 21px/24px var(--display); letter-spacing: -0.02em; }
  .buy .c .b { display: block; font: 800 11px/13px var(--sans); letter-spacing: .04em; text-transform: uppercase; opacity: .9; }
  .buy.one .c { top: 11px; }
  .tm { position: absolute; left: 298px; top: 54px; width: 96px; height: 52px; display: flex; align-items: center; justify-content: center; padding-bottom: 2px;
    border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--bg); font: 800 16px/1 var(--sans); letter-spacing: .02em; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .card .lock { display: none; position: absolute; left: 108px; top: 0; width: 286px; height: 106px; text-align: center; padding-bottom: 2px; }
  .card .lock .n { display: block; font: 700 25px/1.1 var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
  .card .lock .c { display: block; margin-top: 4px; font: 800 18px/1 var(--sans); }
  .card .lock.no { cursor: default; }
  .card.locked .hit, .card.locked .buy, .card.locked .tm { display: none; }
  .card.locked .lock { display: block; }
  .card.locked .ic { cursor: default; }
  .card.locked .ic .bd { opacity: .35; filter: grayscale(1); }
  .card.locked .ic .cn { display: none; }

  .fl { position: absolute; z-index: 20; pointer-events: none; font: 700 24px/1 var(--display); color: var(--money); white-space: nowrap;

  /* ---------- panels ---------- */
  #panel { position: absolute; left: 258px; right: 16px; top: 16px; bottom: 16px; z-index: 8; display: none; flex-direction: column; border-radius: 16px;

  #panel.show { display: flex; }
  #stage.pan #top { visibility: hidden; }

  #ph { flex: none; position: relative; height: 76px; display: flex; align-items: center; justify-content: center; padding: 0 70px; }
  .ribbon { margin: 0; font: 700 30px/1.1 var(--display); letter-spacing: -0.02em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pclose { position: absolute; right: 16px; top: 14px; width: 46px; height: 46px; border-radius: 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--bg); }

  #pclose:active { transform: translateY(2px); border-bottom-width: 2px; }
  #pb { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 24px 22px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  .pbuy { height: 46px; min-width: 92px; padding: 0 16px 0; font: 800 14px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

  @media (hover: hover) { .pbuy.alt:hover { background: var(--panel-soft); } }
  .pbuy.alt:active { transform: translateY(2px); border-bottom-width: 2px; }

  @media (hover: hover) { .pbuy.ang:not(.bg):hover { background: var(--gold-hi); } }
  .meter { height: 14px; margin-top: 7px; position: relative; overflow: hidden; border-radius: 7px; background: var(--line); }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--gold); }

  .ainv .st { padding: 14px 2px; min-width: 0; }
  .ainv .k { display: block; font: 800 13px/18px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ainv b { display: block; margin-top: 4px; font: 700 28px/34px var(--display); letter-spacing: -0.02em; color: var(--gold-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ainv b.g { color: var(--money); }
  .ainv b.d { color: var(--text); }

  .ainv .rs .sp { flex: 1; }

  .empty { padding: 30px 0; font: 800 17px/1.3 var(--sans); color: var(--text-dim); text-align: center; }

  /* ---------- away ---------- */
  #shade { position: fixed; inset: 0; z-index: 5900; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  #shade.show { opacity: 1; pointer-events: auto; }
  #away { position: fixed; left: 0; right: 0; top: 0; bottom: 0; margin: auto; height: max-content; z-index: 6000; transform: translateY(16px); opacity: 0; pointer-events: none; text-align: center;
    width: 380px; max-width: calc(100vw - 32px); padding: 22px 24px 24px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); border-bottom-width: 4px;
    color: var(--text); transition: opacity 0.3s ease, transform 0.3s ease; }

  #away .ribbon { margin: 0 auto 8px; white-space: normal; }
  #away .k { font: 700 17px/1.3 var(--sans); color: var(--text-dim); }
  #away b { display: block; margin: 10px 0 18px; font: 700 40px/1.1 var(--display); letter-spacing: -0.02em; color: var(--money); word-break: break-word; }
  #away .pbuy { width: 100%; height: 54px; font-size: 16px; }

  /* ---------- narrow: single column ---------- */
  body.narrow #stage { width: auto; height: auto; right: 0; bottom: 0; }
  body.narrow #side { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 68px; z-index: 9; display: flex; align-items: center; gap: 6px; padding: 0 8px 2px;
    background: var(--bg); border-right: 0; border-top: 2px solid var(--line); }
  body.narrow #cap, body.narrow #side .rail { display: none; }
  body.narrow .nav { position: relative; left: auto !important; top: auto !important; width: auto !important; height: 48px; flex: 1; min-width: 0; }
  body.narrow .nav .pp { border-radius: 10px; }
