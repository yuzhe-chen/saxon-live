<script>
'use strict';
/* ================= room bridge ================= */
var Room = (function () {
  var n = 0, waits = {};
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || m.type !== 'room-res' || !waits[m.reqId]) return;
    var w = waits[m.reqId]; delete waits[m.reqId]; m.ok ? w.res(m.result) : w.rej(new Error(m.error || 'conn'));
  });
  function call(op, args) {
    return new Promise(function (res, rej) {
      if (window.parent === window) { rej(new Error('conn')); return; }
      var id = 'r' + (++n) + '_' + Date.now();
      waits[id] = { res: res, rej: rej };
      try { parent.postMessage({ type: 'room', reqId: id, op: op, args: args || {} }, '*'); } catch (e) { delete waits[id]; rej(new Error('conn')); }
      setTimeout(function () { if (waits[id]) { delete waits[id]; rej(new Error('conn')); } }, 20000);
    });
  }
  return { call: call };
})();

/* ================= utils ================= */
const GAME = 'voteout';
const MAXP = 12, NQ = 12, Q_TIME = 60, RECAP_AT = 7;
const $ = (s, r) => (r || document).querySelector(s);

function btn(label, cls, fn) { const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; b.onclick = fn; return b; }
function rid() { return Math.random().toString(36).slice(2, 10); }
function sget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function clean(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f\u2028\u2029]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }
function trimName(s) { return s.length > 18 ? s.slice(0, 18).trim() + '...' : s; }
/* keys typed into inputs stay in the game (the planner listens for keys on this document) */
function stopKeys(i) { ['keydown', 'keyup', 'keypress'].forEach(t => i.addEventListener(t, e => e.stopPropagation())); return i; }
function inp(cls, ph, max) {
  const i = el('input', 'inp' + (cls ? ' ' + cls : '')); i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false;
  if (ph) i.placeholder = ph; if (max) i.maxLength = max;
  return stopKeys(i);
}

  vote: '<svg viewBox="0 0 444.2 444.2"><path fill="currentColor" d="M180.4,382.5c-11,0-21.4-4.8-28.6-13.1L61.4,263.9c-13.5-15.8-11.7-39.6,4.1-53.1c15.8-13.5,39.5-11.7,53.1,4.1l59.1,68.9L364.3,58.7c28.9-40.5,59.1-18.1,30.1,22.6L211,366.7c-6.7,9.4-17.4,15.2-29,15.7C181.5,382.5,180.9,382.5,180.4,382.5z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

/* ================= saves (the planner keeps them per device; storage in the frame is a fallback) ================= */
const Save = {
  d: { custom: [], played: [], last: null },
  load(done) {
    try { const ls = JSON.parse(sget('voteout-save') || 'null'); if (ls && typeof ls === 'object') this.fix(ls); } catch (e) {}
    try { if (!parent || parent === window) { done(); return; } } catch (e) { done(); return; }
    const reqId = 'vo' + Date.now().toString(36) + rid();
    let fin = false;
    const end = () => { if (fin) return; fin = true; window.removeEventListener('message', onMsg); done(); };
    const onMsg = e => {
      const m = e.data; if (!m || m.type !== 'game-load-res' || m.reqId !== reqId) return;
      try { const o = typeof m.data === 'string' && m.data ? JSON.parse(m.data) : null; if (o && typeof o === 'object') this.fix(o); } catch (err) {}
      end();
    };
    window.addEventListener('message', onMsg);
    if (window.SXR) SXR.hold(reqId); try { parent.postMessage({ type: 'game-load', game: GAME, reqId: reqId }, '*'); } catch (e) { end(); return; }
    setTimeout(end, 15000);
  },
  fix(o) {
    if (Array.isArray(o.custom)) this.d.custom = o.custom.filter(g => g && typeof g.id === 'string' && Array.isArray(g.q)).slice(0, 20)
      .map(g => ({ id: g.id.slice(0, 20), name: clean(g.name, 40) || 'My Game', q: g.q.map(x => clean(x, 200)).filter(Boolean).slice(0, 40) }));
    if (Array.isArray(o.played)) this.d.played = o.played.filter(x => typeof x === 'string').slice(-50);
    if (o.last && typeof o.last === 'object' && typeof o.last.code === 'string') this.d.last = o.last;
    if (o.music) this.d.music = o.music;
  },
  put() {
    const s = JSON.stringify(this.d);
    sset('voteout-save', s);
    try { if (parent && parent !== window) parent.postMessage({ type: 'game-save', game: GAME, data: s }, '*'); } catch (e) {}
  }
};

    al.appendChild(veil);
    const list = el('ul', 'plist');
    add(w, add(el('div', 'mt16'), al), err, below);
    const vote = i => {
      const s = C.st, mine = myVotes(s);
      if (mine.includes(i)) { err.textContent = 'You can\'t change your vote!'; return; }
      if (mine.length >= s.av) { err.textContent = 'Looks like you are out of votes!'; return; }
      err.textContent = '';
      const l = C.myv[key] = C.myv[key] || { list: [], at: 0 };
      l.list.push(i); l.at = Date.now();
      toHost({ k: 'vote', g: s.g, qi: s.qi, v: l.list.slice() });
      upd();
    };
    let bk = '';
    const upd = () => {
      const s = C.st, mine = myVotes(s), out = mine.length >= capFor(s, Net.me);
      items.forEach((b, i) => b.classList.toggle('on', mine.includes(i)));
      veil.hidden = !out;
      const k = out ? 'out' : 'left:' + (s.av - mine.length);
      if (k !== bk) {
        bk = k; below.innerHTML = '';
        if (out) add(below, el('div', 'h3 mt6', 'Waiting for other players...'), list);
        else below.appendChild(el('div', 'mt3 center muted', 'You have ' + (s.av - mine.length) + ' vote' + (s.av - mine.length === 1 ? '' : 's') + ' remaining...'));
      }
      if (out) { list.innerHTML = ''; s.pl.forEach(p => list.appendChild(plItem(p, ((s.vt || {})[p.id] || []).length >= capFor(s, p.id) || (p.id === Net.me)))); }
    };
    return upd;
  });
}
function hostBtnOr(label, waitText, fn) {
  const d = el('div', 'mt12 center');
  if (isHost()) d.appendChild(btn(label, '', fn)); else d.appendChild(el('div', 'muted', waitText));
  return d;
}
function dropBtn(p) {
  if (!isHost() || p.id === Net.me) return null;
  const b = el('button', 'drop', 'Drop'); b.type = 'button';
  b.onclick = () => { if (confirm('Are you sure you want to drop this player from the game?')) hostDrop(p.id); };
  return b;
}
function scrWinner() {
  const st = C.st;
  Tm.dl = () => 0;
  view('w:' + st.g + ':' + st.qi + ':' + isHost() + ':' + st.v, w => {
    const win = (st.win || []).map(i => st.ans[i]).filter(Boolean);
    if (!st.ans.length) w.appendChild(el('div', 'h3', 'It would appear there were no answers...'));
    else {
      if (win.length === 1) {
        const a = win[0], p = plById(a.a) || { name: '', a: -1 };
        add(w, el('div', 'h3', 'The Winning Answer Is...'), el('h1', 'mt6', a.t), el('div', 'h3 mt3', a.n + (a.n === 1 ? ' Vote' : ' Votes')),
          add(el('div', 'mt6 center'), avEl(p.a, 'lg'), el('div', 'pname', p.name)));
      } else {
        const ul = el('ul', 'plist');
        win.forEach(a => { const p = plById(a.a) || { id: '', name: '', a: -1 }; const li = el('li'); add(li, avEl(p.a), el('div', 'nm', p.name)); ul.appendChild(li); });
        add(w, el('div', 'h3', 'It\'s a Tie!'), el('div', 'h3 mt1', (win[0] ? win[0].n : 0) + ' Votes Each'), ul);
      }
      const rows = st.pl.slice().sort((a, b) => b.nv - a.nv);
      const tb = el('div', 'tbl'), table = el('table'), body = el('tbody');
      rows.forEach(p => {
        const ans = st.ans.find(a => a.a === p.id), won = (st.win || []).some(i => st.ans[i] && st.ans[i].a === p.id);
        const tr = el('tr');
        add(tr, add(el('td', 'a'), avEl(p.a, 'md')),
          add(el('td'), add(el('div', 'who'), el('strong', '', p.name), dropBtn(p)), el('div', 'say', ans ? ans.t : '')),
          add(el('td', 'r'), el('span', 'bub' + (won ? ' on' : ''), String(p.nv || 0))));
        body.appendChild(tr);
      });
      w.appendChild(add(tb, add(table, body)));
    }
    const last = st.qi + 1 >= st.qs.length;
    w.appendChild(hostBtnOr(last ? 'Determine Game Winner' : 'Next Question',
      last ? 'Waiting for host to move to game end...' : 'Waiting for host to start next question...', () => hostNext()));
  });
}
function scoreTable(st) {
  const rows = st.pl.slice().sort((a, b) => b.w - a.w || b.t - a.t);
  const tb = el('div', 'tbl narrow'), table = el('table'), head = el('thead'), body = el('tbody');
  const hr = el('tr'); add(hr, el('th', '', 'Player'), el('th'), el('th', 'r', 'Questions'), el('th', 'r', 'Votes')); head.appendChild(hr);
  rows.forEach(p => {
    const tr = el('tr');
    add(tr, add(el('td', 'a'), avEl(p.a, 'md')), add(el('td'), add(el('div', 'who'), el('strong', '', p.name), dropBtn(p))),
      add(el('td', 'r'), el('span', 'bub on', String(p.w))), add(el('td', 'r'), el('span', 'bub', String(p.t))));
    body.appendChild(tr);
  });
  return add(tb, add(table, head, body));
}
function scrRecap() {
  const st = C.st;
  Tm.dl = () => 0;
  view('r:' + st.g + ':' + isHost() + ':' + st.v, w => {
    const left = st.qs.length - (st.qi + 1);
    add(w, el('div', 'h1 sm', left + ' Questions Left!'), el('div', 'h3 mt6', 'The Score So Far...'), scoreTable(st),
      hostBtnOr('Continue The Game', 'Waiting for host to continue the game...', () => hostNext()));
  });
}
function finalWinners(pl) {
  if (!pl.length) return { win: [], most: [] };
  const mw = Math.max.apply(null, pl.map(p => p.w)), mt = Math.max.apply(null, pl.map(p => p.t));
  let win = pl.filter(p => p.w === mw);
  if (win.length > 1) { const bt = Math.max.apply(null, win.map(p => p.t)); win = win.filter(p => p.t === bt); }
  return { win, most: pl.filter(p => p.t === mt) };
}
function scrEnd() {
  const st = C.st;
  Tm.dl = () => 0;
  view('e:' + st.g + ':' + isHost() + ':' + st.v, w => {
    const r = finalWinners(st.pl);
    const big = p => add(el('div', 'mt6 center'), avEl(p.a, 'lg'), el('h1', 'mt2', p.name));
    if (r.win.length === 1) {
      const p = r.win[0];
      add(w, el('div', 'h3', 'The Game Winner Is...'), big(p), el('div', 'h3 mt6', p.w + (p.w === 1 ? ' Question Won' : ' Questions Won')), el('div', 'h3', p.t + (p.t === 1 ? ' Total Vote' : ' Total Votes')));
      if (r.most.length === 1 && r.most[0].id !== p.id) {
        const m = r.most[0];
        add(w, el('div', 'h3 mt12', 'Player with the Most Votes...'), big(m), el('div', 'h3 mt6', m.t + (m.t === 1 ? ' Total Vote' : ' Total Votes')));
      }
    } else if (r.win.length > 1) {
      const ul = el('ul', 'plist');
      r.win.forEach(p => { const li = el('li'); add(li, avEl(p.a), el('div', 'nm', p.name)); ul.appendChild(li); });
      add(w, el('div', 'h3', 'The Game Is a Tie!'), el('div', 'h3 mt6', r.win[0].w + ' Questions Won Each'), el('div', 'h3', r.win[0].t + ' Votes Each'), ul);
    }
    w.appendChild(scoreTable(st));
    if (isHost()) w.appendChild(add(el('div', 'mt12 center'), btn('Play Again', '', () => hostAgain())));
  });
}

function quitRoom() { if (Net.on) { Net.on = false; Room.call('leave', { code: Net.code, token: Net.token }).catch(() => {}); } }
document.getElementById('brand').onclick = () => { quitRoom(); try { parent.postMessage({ type: 'games-menu' }, '*'); } catch (e) {} };
window.addEventListener('pagehide', quitRoom);
Save.load(() => { if (!MODE && viewKey === 'home') { viewKey = null; scrHome(); } });
scrHome();
</script>
